function offenseField(field,value){
 if(field==='filter')state.offenseFilter=value;
 if(field==='sort')state.offenseSort=value;
 if(field==='owner'){state.owners[state.selected]=value;offenseRecord('Owner assigned: '+value)}

 if(field==='status'){
  if(value==='Closed' && (!(state.notes[state.selected]||'').trim() || !state.offenseDisposition || !state.offenseDisposition[state.selected] || state.offenseDisposition[state.selected]==='Not assessed')){alert('Before closing, enter an investigation note and select a documented disposition.');render();return}
  state.statuses[state.selected]=value;offenseRecord('Workflow status: '+value);
 }
 save();render();
}

function timeline(){
 const o=getOff(state.selected)||OFFENSES[0],all=eFor(o.id).slice().sort((a,b)=>a.timestamp.localeCompare(b.timestamp));

 const gap=(a,b)=>{if(!a||!b)return '—';let d=(new Date(b.timestamp.replace(' ','T'))-new Date(a.timestamp.replace(' ','T')))/60000;return Number.isFinite(d)?(d<60?Math.round(d)+' min':(d/60).toFixed(1)+' hr'):'—'};

 const events=rows.length?rows.map((e,i)=>{const previous=all[all.findIndex(x=>x.id===e.id)-1];return '<div class="soc-time-entry '+(selected&&selected.id===e.id?'soc-time-active':'')+'"><div class="soc-time-marker"></div><div class="soc-time-body"><div class="row"><b>'+esc(e.timestamp)+'</b><span class="pill">'+esc(e.kind)+'</span></div><p><b>'+esc(e.action)+'</b> · '+esc(e.category)+'</p><p class="muted small">'+esc(e.source)+' → '+esc(e.destination)+' · '+esc(e.user||'Unknown user')+' · severity '+e.severity+'</p><p class="small">'+esc(e.detail)+'</p><div class="toolbar"><button class="btn" onclick="timelineSelect(\''+e.id+'\')">Inspect record</button><button class="btn" onclick="bookmark(\''+e.id+'\')">'+(state.bookmarks.includes(e.id)?'Remove bookmark':'Bookmark evidence')+'</button><span class="muted small">Since prior observed event: '+gap(previous,e)+'</span></div></div></div>'}).join(''):'<p class="muted">No events match the current filters. Clear filters to review the full case.</p>';
 const bookmarked=all.filter(e=>state.bookmarks.includes(e.id));
 const hypotheses=state.timelineHypotheses||{};const hypothesis=hypotheses[o.id]||'';
 return '<div class="soc-brief"><div><span class="pill">CASE RECONSTRUCTION · OBSERVED TELEMETRY</span><h2>Investigation timeline</h2><p class="muted small">Reconstruct sequence, verify chronology, preserve evidence, and distinguish observation from interpretation.</p></div><select aria-label="Choose offense" onchange="state.selected=this.value;state.timelineEvent=null;save();render()">'+OFFENSES.map(x=>'<option value="'+x.id+'" '+(o.id===x.id?'selected':'')+'>#'+x.id+' · '+esc(x.title)+'</option>').join('')+'</select></div>'
 +'<div class="grid soc-metrics"><div class="card metric"><span>LINKED EVENTS</span><strong>'+all.length+'</strong><span>Correlated to offense #'+o.id+'</span></div><div class="card metric"><span>OBSERVED WINDOW</span><strong>'+gap(first,last)+'</strong><span>First to last timestamp</span></div><div class="card metric"><span>LOG SOURCE TYPES</span><strong>'+Object.keys(counts).length+'</strong><span>Distinct source categories</span></div><div class="card metric"><span>BOOKMARKED EVIDENCE</span><strong>'+bookmarked.length+'</strong><span>Preserved event references</span></div></div>'
 +'<div class="card"><div class="row"><div><h2>Case context · #'+o.id+'</h2><p>'+esc(o.title)+'</p></div>'+badge(o.risk)+'</div><p>'+esc(o.description)+'</p><div class="soc-detail-grid"><div><span>First event</span><b class="soc-smallval">'+(first?esc(first.timestamp):'—')+'</b></div><div><span>Last event</span><b class="soc-smallval">'+(last?esc(last.timestamp):'—')+'</b></div><div><span>Primary target</span><b class="soc-smallval">'+esc(o.target)+'</b></div><div><span>Current disposition</span><b class="soc-smallval">'+esc((state.offenseDisposition||{})[o.id]||'Not assessed')+'</b></div></div><div class="toolbar"><button class="btn" onclick="setPage(\'offenses\')">Open offense manager</button><button class="btn" onclick="setPage(\'events\')">Search all logs</button><button class="btn" onclick="timelineExport()">Export timeline CSV</button></div></div>'
 +'<div class="two"><div class="card"><h2>Chronological evidence sequence</h2><p class="muted small">Entries are ordered by event timestamp. The time between records is not necessarily attacker dwell time.</p>'+fields+'<p class="muted small">Showing '+rows.length+' of '+all.length+' records.</p><div class="soc-time-scroll">'+events+'</div></div><div>'+ (selected?'<div class="card"><div class="row"><h2>Evidence inspector</h2><span class="pill">'+selected.id+'</span></div><p>'+esc(selected.detail)+'</p><div class="soc-detail-grid"><div><span>Event timestamp</span><b class="soc-smallval">'+esc(selected.timestamp)+'</b></div><div><span>Rule</span><b class="soc-smallval">'+esc(selected.rule)+'</b></div><div><span>Source</span><b class="soc-smallval">'+esc(selected.source)+'</b></div><div><span>Destination</span><b class="soc-smallval">'+esc(selected.destination)+'</b></div></div><h3>Original event payload</h3><pre class="detail">'+esc(JSON.stringify(selected.raw,null,2))+'</pre><div class="toolbar"><button class="btn" onclick="state.event=\''+selected.id+'\';setPage(\'events\')">Open in Log Activity</button><button class="btn" onclick="bookmark(\''+selected.id+'\')">'+(state.bookmarks.includes(selected.id)?'Remove bookmark':'Bookmark record')+'</button></div></div>':'<div class="card"><h2>Evidence inspector</h2><p>Select a timeline event to inspect raw telemetry.</p></div>')
 +'<div class="card"><h2>Reconstruction notes</h2><p class="muted small">Write a defensible sequence: what happened, when it happened, which facts are supported, and what remains uncertain.</p><textarea rows="6" placeholder="Observed sequence, competing explanations, evidence gaps, recommended next steps..." oninput="timelineNote(this.value)">'+esc(hypothesis)+'</textarea><div class="toolbar"><button class="btn" onclick="timelineSaveNote()">Save reconstruction note</button></div><h3>Validation prompts</h3><ul><li>Do source and destination identifiers remain consistent across records?</li><li>Are there legitimate administrative or business explanations?</li><li>Do timestamps establish causation, or only temporal proximity?</li><li>What additional evidence would confirm or disprove the hypothesis?</li></ul></div><div class="card"><h2>Evidence coverage</h2>'+Object.entries(counts).map(([k,n])=>'<div class="soc-facet"><span>'+esc(k)+'</span><b>'+n+'</b></div>').join('')+'<p class="notice">Offense association is simulated correlation. Do not infer a confirmed attack chain or MITRE technique solely from timeline proximity.</p></div></div></div>';

 '+(state.drillAnswers[i]===d.correct?'':'warn')+'"><b>'+(state.drillAnswers[i]===d.correct?'Decision aligned with scenario':'Review your decision')+'</b><p>'+esc(d.why)+'</p><p class="small">Evidence leads: '+esc(d.evidence.join(', '))+'. Written evidence and rationale are checked for completion only; an instructor should verify their accuracy.</p></div>':'')+'</div>').join('')+'<div class="card"><h2>Investigation package</h2><p>'+complete+' of 7 exercises contain a decision, evidence reference and rationale (25+ characters).</p><div class="toolbar"><button class="btn primary" onclick="submitDrills()">Submit all decisions and reveal expert review</button><button class="btn" onclick="resetDrills()">Retry all seven</button></div>'+(state.drillSubmitted?'<div class="alert"><b>Structured score: '+score+'/98</b><p>70 points for decision selection, 14 for rationale completion, 14 for evidence reference completion. Evidence quality and technical accuracy of written explanations require instructor review. Incorrect choices can be revised and resubmitted.</p></div>':'<p class="small">Feedback is withheld until submission. Submitting an incomplete package is permitted.</p>')+'</div>'}
